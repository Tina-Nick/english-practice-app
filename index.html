<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英作・語順整序 「完全制覇」への道</title>

<link rel="stylesheet" href="style.css">

<script src="data/grade1.js"></script>
<script src="data/grade2.js"></script>
<script src="data/grade3.js"></script>

</head>

<body>

<div class="container">

<h1>
英作・語順整序 「完全制覇」への道
</h1>

<div class="settings">

<h2>問題形式</h2>

<label>
<input type="radio"
name="mode"
value="translation"
checked>
和文英作
</label>

<label>
<input type="radio"
name="mode"
value="sorting">
語順整序
</label>

<h2>出題範囲</h2>

<select id="category">

<option value="g1">
中1ランダム
</option>

<option value="g2">
中2ランダム
</option>

<option value="g3">
中3ランダム
</option>

<option value="g12">
中1〜2ランダム
</option>

<option value="all">
中1〜3ランダム
</option>


<option disabled>
────────
</option>

<option disabled>
【中1】
</option>

<option value="unit1">
be動詞
</option>

<option value="unit2">
一般動詞
</option>

<option value="unit3">
複数形
</option>

<option value="unit4">
疑問詞
</option>

<option value="unit5">
現在進行形
</option>

<option value="unit6">
can
</option>

<option disabled>
────────
</option>

<option disabled>
【中2】
</option>

<option value="unit21">
比較
</option>

<option value="unit22">
不定詞
</option>

<option value="unit23">
動名詞
</option>

<option value="unit24">
助動詞
</option>

<option value="unit25">
there is / are
</option>

<option value="unit26">
接続詞
</option>

<option disabled>
────────
</option>

<option disabled>
【中3】
</option>

<option value="unit31">
現在完了
</option>  
  
<option disabled>
【復習】
</option>

<option value="wrong">
苦手問題のみ
</option>

</select>


<h2>問題数</h2>

<select id="count"></select>

<button onclick="startQuiz()">
スタート
</button>

</div>


<div id="quizArea"></div>

</div>

<script src="app.js"></script>

</body>
</html>
